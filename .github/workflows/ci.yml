name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 仓库质量校验（JSON 语法 / key 唯一性 / dead_sites 一致性）
        run: python tools/validate.py

      - name: 探测脚本语法检查
        run: python -m py_compile tools/probe_sites.py tools/validate.py
